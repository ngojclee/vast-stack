# ================================================================
# LiteLLM Proxy config — AUDIO GATEWAY, chạy song song CLIProxyAPI
#
# TRIẾT LÝ: file này CHỈ có phần tối thiểu (kỹ thuật).
# MỌI API KEY / upstream tạo & sửa trong GUI:
#   http://<host>:4000/ui
#   - Settings → LLM Credentials   → thêm cpa-cred (key CPA), openai-cred,
#                                    groq-cred, elevenlabs-cred... (không hardcode)
#   - Models + Endpoints → Add Model:
#       model_name: cpa/*                    (delegate text → CPA, giữ plugin
#                                             agy-identity-bridge / vision-bridge)
#       litellm_params: { model: openai/*,
#                         api_base: http://cli-proxy-api:8317/v1,
#                         litellm_credential_name: cpa-cred }
#       model_name: gpt-4o-mini-tts, whisper-large-v3-turbo, eleven_turbo_v2_5,
#       gemini-tts, deepgram-nova3 ...      (audio — chọn theo key anh có)
#   - Settings → Virtual Keys      → phát key riêng cho từng client
#
# Config giờ nằm TRỰC TIẾP trong compose.yml (env LITELLM_CONFIG_YAML,
# block `environment:` của service litellm) — KHÔNG còn bind-mount file.
# File này chỉ còn là BẢNG THAM CHIẾU để đọc/dịch; khi cần sửa config boot
# thì sửa block LITELLM_CONFIG_YAML trong compose.yml → commit → redeploy.
# (Lý do bỏ mount: thiếu file nguồn → Docker âm thầm tạo directory ngay
#  đường đích → IsADirectoryError khi litellm mở /app/config.yaml.)
# ================================================================

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Tắt login GUI bằng master key/UI_USERNAME+UI_PASSWORD (cảnh báo
  # "Environment-credential login is enabled"). Đăng nhập = admin account
  # tạo trong GUI. Master key VẪN còn hiệu lực làm API key cho client.
  # Quên mật khẩu admin? Xóa dòng này + redeploy là login lại bằng master key.
  disable_env_credential_login: true

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 60
  retry_policy:
    BadRequestErrorRetries: 1
    TimeoutErrorRetries: 2
    RateLimitErrorRetries: 3

# model_list để TRỐNG khi STORE_MODEL_IN_DB=True (litellm ≥1.102 boot OK):
# toàn bộ model thật nằm trong Postgres, thêm qua GUI hoặc POST /model/new.
model_list: []
