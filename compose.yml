# ================================================================
# vast-stack — production-ready Vast.ai + CPA stack
#
# Portainer deployment:
#   1. Tạo repo/stack trong Portainer (Build from git, hoặc paste compose
#      + đặt các thư mục gateway/ tunnel/ config-sync/ cạnh nhau)
#   2. Set environment variables (xem .env.example)
#   3. Deploy
#
# KHÔNG nhúng Python code vào compose — mỗi service build từ Dockerfile
# riêng (gateway/, tunnel/, config-sync/). Cấu hình tập trung ở .env.
#
# Mọi bind-mount host đi qua DOCKER_DATA_ROOT (mặc định /home/Docker).
# Đổi root data chỉ sửa 1 env trong Portainer — không rải path khắp file.
# ================================================================

name: vast-cpa

networks:
  vast-net:
    driver: bridge

services:
  # ============================================================
  # 1) DYNAMIC SSH TUNNEL MANAGER
  # ============================================================
  vast-tunnel:
    build: ./tunnel
    container_name: vast-tunnel
    restart: unless-stopped
    networks:
      - vast-net
    environment:
      TUNNEL_SCAN_SECONDS: "${TUNNEL_SCAN_SECONDS:-5}"
      REMOTE_LLM_PORT: "${REMOTE_LLM_PORT:-18000}"
    volumes:
      # SSH key của vast-tunnel: mount vào /vast-ssh (script đọc đúng chỗ này)
      - ${DOCKER_DATA_ROOT:-/home/Docker}/vast-tunnel/ssh:/vast-ssh:rw
      - ${DOCKER_DATA_ROOT:-/home/Docker}/vast-tunnel/instances.txt:/etc/vast/instances.txt:rw

  # ============================================================
  # 2) VAST GATEWAY — lifecycle + routing (KHÔNG đụng CPA config)
  # ============================================================
  vast-gateway:
    build: ./gateway
    container_name: vast-gateway
    restart: unless-stopped
    networks:
      - vast-net
    depends_on:
      - vast-tunnel
    expose:
      - "18000"
    environment:
      VAST_API_KEY: "${VAST_API_KEY}"
      API_LLM_SERVER: "${API_LLM_SERVER}"
      VAST_PROVIDER_NAME: "${VAST_PROVIDER_NAME:-ln.vastai}"
      VAST_INSTANCE_IDS: "${VAST_INSTANCE_IDS:-}"
      VAST_CLUSTER_LABEL: "${VAST_CLUSTER_LABEL:-cpa-vllm}"
      VAST_MANAGE_ALL_INSTANCES: "${VAST_MANAGE_ALL_INSTANCES:-false}"
      AUTO_SYNC_INSTANCES: "${AUTO_SYNC_INSTANCES:-true}"
      AUTO_SCALE_ENABLED: "${AUTO_SCALE_ENABLED:-true}"
      IDLE_TIMEOUT_MINUTES: "${IDLE_TIMEOUT_MINUTES:-30}"
      BOOT_GRACE_SECONDS: "${BOOT_GRACE_SECONDS:-900}"
      BOOT_POLL_SECONDS: "${BOOT_POLL_SECONDS:-5}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-60}"
      HEALTH_CACHE_SECONDS: "${HEALTH_CACHE_SECONDS:-3}"
      REMOTE_LLM_PORT: "${REMOTE_LLM_PORT:-18000}"
      LANGUAGE_PROMPT: "${LANGUAGE_PROMPT:-}"
    volumes:
      # READ-ONLY: gateway KHÔNG được ghi vào CPA config (chống corrupt YAML)
      - ${DOCKER_DATA_ROOT:-/home/Docker}/vast-tunnel/instances.txt:/etc/vast/instances.txt:rw
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:18000/__gateway/health',
          timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ============================================================
  # 3) CONFIG SYNC — cập nhật CPA config + VLLM keys an toàn (atomic)
  # ============================================================
  config-sync:
    build: ./config-sync
    container_name: config-sync
    restart: unless-stopped
    networks:
      - vast-net
    environment:
      VAST_API_KEY: "${VAST_API_KEY}"
      API_LLM_SERVER: "${API_LLM_SERVER}"
      VAST_PROVIDER_NAME: "${VAST_PROVIDER_NAME:-ln.vastai}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-60}"
      DRY_RUN: "${CONFIG_SYNC_DRY_RUN:-false}"
    volumes:
      # config-sync là service DUY NHẤT được ghi CPA config (atomic, có backup)
      - ${DOCKER_DATA_ROOT:-/home/Docker}/CLIProxyAPI/config.yaml:/cpa-config.yaml:rw
      - ${DOCKER_DATA_ROOT:-/home/Docker}/CLIProxyAPI/config.yaml.bak:/cpa-config.yaml.bak:rw
      - ${DOCKER_DATA_ROOT:-/home/Docker}/vast-tunnel/instances.txt:/etc/vast/instances.txt:ro
      # SSH key để cập nhật API key trên VLLM nodes (chỉ đọc)
      - ${DOCKER_DATA_ROOT:-/home/Docker}/vast-tunnel/ssh:/vast-ssh:ro
      # State (change detection) — persistent trên host
      - ${DOCKER_DATA_ROOT:-/home/Docker}/vast-tunnel/state:/state:rw

  # ============================================================
  # 4) CLIPROXYAPI (+ VAST CLUSTER BENCH plugin)
  # ============================================================
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    pull_policy: if_not_present
    container_name: cli-proxy-api
    restart: unless-stopped
    init: true
    networks:
      - vast-net
    depends_on:
      vast-gateway:
        condition: service_healthy
    labels:
      # Watchtower: chỉ update container này, scope cliproxy
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: cliproxy
    ports:
      - "127.0.0.1:1455:1455"
      - "8317:8317"
    environment:
      TZ: "${TZ:-Europe/Paris}"
      MANAGEMENT_PASSWORD: "${MANAGEMENT_PASSWORD}"
      OPENCODEX_DEVICE_ID_PATH: "${OPENCODEX_DEVICE_ID_PATH:-/data/opencodex/device-id}"
      CPA_PLUGIN_GITHUB_TOKEN: "${CPA_PLUGIN_GITHUB_TOKEN:-}"
      CPA_CODEX_COMPACTION_KEY: "${CPA_CODEX_COMPACTION_KEY:-}"
      # >>> VAST CLUSTER BENCH plugin <<<
      VAST_API_KEY: "${VAST_API_KEY}"
      VAST_TUNNEL_DIR: "/vast-tunnel"
    volumes:
      - ${DOCKER_DATA_ROOT:-/home/Docker}/CLIProxyAPI/config.yaml:/CLIProxyAPI/config.yaml:rw
      - ${DOCKER_DATA_ROOT:-/home/Docker}/CLIProxyAPI/.cli-proxy-api:/root/.cli-proxy-api:rw
      - ${DOCKER_DATA_ROOT:-/home/Docker}/CLIProxyAPI/plugins:/CLIProxyAPI/plugins:rw
      - ${DOCKER_DATA_ROOT:-/home/Docker}/CLIProxyAPI/logs:/CLIProxyAPI/logs:rw
      - ${DOCKER_DATA_ROOT:-/home/Docker}/CLIProxyAPI/opencodex:/data/opencodex:rw
      # >>> VAST CLUSTER BENCH: mount tunnel → tự dò instances.txt + key SSH <<<
      - ${DOCKER_DATA_ROOT:-/home/Docker}/vast-tunnel:/vast-tunnel:ro

  # ============================================================
  # 5) WATCHTOWER — tự update image cli-proxy-api (scope cliproxy)
  #     Chỉ update container có label scope=cliproxy; KHÔNG đụng
  #     gateway/tunnel/config-sync (build từ source).
  # ============================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    networks:
      - vast-net
    environment:
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-21600}"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "cliproxy"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ============================================================
  # 6) LITELLM — audio gateway (TTS/STT) + virtual keys + GUI
  #    CHẠY SONG SONG với CPA (không thay thế):
  #      - text / OAuth / vision-bridge  → CPA :8317 giữ nguyên
  #      - audio (OpenAI/ElevenLabs/Groq/Gemini/Deepgram) → LiteLLM :4000
  #      - model_name "cpa/*" delegate ngược về CPA (1 cổng thống nhất nếu muốn)
  #    GUI:  http://<host>:4000/ui   |   API: http://<host>:4000/v1
  # ============================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    pull_policy: if_not_present
    container_name: litellm
    restart: unless-stopped
    networks:
      - vast-net
    depends_on:
      litellm-db:
        condition: service_healthy
    ports:
      - "4000:4000"
    # KHÔNG bind-mount file config nữa (nguồn gốc lỗi IsADirectoryError:
    # thiếu file → Docker âm thầm tạo DIRECTORY ngay đường đích).
    # Config được nhét thẳng vào env LITELLM_CONFIG_YAML, lúc boot container
    # tự ghi ra /tmp rồi chạy. Miễn nhiễm mọi sự cố mount/git-pull.
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        printf '%s' "$$LITELLM_CONFIG_YAML" > /tmp/litellm-config.yaml
        exec /app/.venv/bin/litellm --config /tmp/litellm-config.yaml --port 4000 --host 0.0.0.0
    environment:
      TZ: "${TZ:-Europe/Paris}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      # Khoá mã hoá credentials/models trong DB — TÁCH khỏi master key.
      # Đổi LITELLM_MASTER_KEY sau khi DB đã có data = toàn bộ ciphertext
      # (api_key, litellm_params) không giải mã được → router drop hết
      # deployment ("Did your master_key/salt key change recently?").
      # Salt key PIN CỐ ĐỊNH một lần (Portainer env), KHÔNG BAO GIỜ đổi.
      # Default = master key: giữ tương thích data đã mã hoá trước đó.
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:-${LITELLM_MASTER_KEY}}"
      DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm"
      STORE_MODEL_IN_DB: "True"
      # Các API key (CPA, OpenAI, ElevenLabs, Groq, Gemini, Deepgram...)
      # KHÔNG đặt ở đây — tạo trong GUI: Settings → LLM Credentials.
      # Đây là toàn bộ nội dung litellm config (chỉ placeholder + master_key ref):
      LITELLM_CONFIG_YAML: |
        litellm_settings:
          drop_params: true
          num_retries: 2
          request_timeout: 600
        general_settings:
          master_key: os.environ/LITELLM_MASTER_KEY
          # BẮT BUỘC cho /model/new + quản trị model: khai báo cả Ở ĐÂY —
          # env STORE_MODEL_IN_DB một mình KHÔNG đủ (config reload 30s đọc lại
          # file; row DB LiteLLM_Config."general_settings" đè tiếp nếu tồn tại).
          store_model_in_db: true
          # Tắt login GUI bằng master key / UI_USERNAME+UI_PASSWORD (cảnh báo
          # "Environment-credential login is enabled"). Đăng nhập = admin account
          # tạo trong GUI. Master key VẪN còn hiệu lực làm API key cho client.
          # Quên mật khẩu admin? Xóa dòng này + redeploy là login lại bằng master key.
          disable_env_credential_login: true
        router_settings:
          routing_strategy: simple-shuffle
          allowed_fails: 3
          cooldown_time: 60
          retry_policy:
            BadRequestErrorRetries: 1
            TimeoutErrorRetries: 2
            RateLimitErrorRetries: 3
        model_list: []
        # (1.102+ boot được với list trống khi STORE_MODEL_IN_DB=True;
        #  model thật nằm trong Postgres, thêm qua GUI hoặc POST /model/new)
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',
          timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================
  # 7) LITELLM DB — Postgres cho virtual keys + spend tracking + GUI
  # ============================================================
  litellm-db:
    image: postgres:16-alpine
    pull_policy: if_not_present
    container_name: litellm-db
    restart: unless-stopped
    networks:
      - vast-net
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${LITELLM_DB_PASSWORD}"
    volumes:
      - ${DOCKER_DATA_ROOT:-/home/Docker}/litellm/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
