# ================================================================
# Stack: Infinity — MỘT container phục vụ CẢ embeddings + rerank (máy llm 10.21.4.101)
#
#   Embeddings      : POST http://10.21.4.101:8080/v1/embeddings   (BAAI/bge-m3, 1024 chiều)
#   Rerank          : POST http://10.21.4.101:8080/v1/rerank       (BAAI/bge-reranker-v2-m3)
#   Danh sách model : GET  http://10.21.4.101:8080/v1/models
#   Health          : GET  http://10.21.4.101:8080/health
#
#   MỘT cổng duy nhất (8080) — chọn model bằng field "model" trong body.
#   Nhiều request tới 2 model khác nhau chạy SONG SONG được
#   (đã đo: 2 embed + 2 rerank cùng lúc → tất cả 200 OK).
#
# DEPLOY: Portainer (server llm) → stack `tei` → Editor → dán file này → Update the stack
#   (giữ tên stack `tei` để update tại chỗ, khỏi tạo stack mới)
# TRƯỚC KHI UPDATE — xoá 2 container cũ đang chiếm tên + cổng 8080/8081:
#   docker rm -f tei-bge-m3 infinity-rerank
#   (models nạp lại từ cache /home/Docker/tei-data; boot ~20-40s, không cần tải mạng)
#
# TEST nhanh sau khi deploy:
#   curl -s http://10.21.4.101:8080/health
#   curl -s http://10.21.4.101:8080/v1/embeddings -H 'Content-Type: application/json' \
#     -d '{"model":"BAAI/bge-m3","input":"xin chào"}'
#   curl -s http://10.21.4.101:8080/v1/rerank -H 'Content-Type: application/json' \
#     -d '{"model":"BAAI/bge-reranker-v2-m3","query":"con mèo đang ngủ ở đâu","documents":["con mèo đang ngủ trên ghế sofa","trời hôm nay mưa rất to"]}'
#
# GHI CHÚ QUAN TRỌNG:
#  - `--url-prefix /v1`: giữ ĐÚNG các đường dẫn cũ (/v1/embeddings, /v1/rerank) →
#    DeepTutor + LiteLLM KHÔNG phải đổi URL. (Đường KHÔNG prefix sẽ trả 404 — đúng thiết kế.)
#    Riêng LiteLLM: model rerank cần api_base = http://10.21.4.101:8080/v1
#    (branch "infinity" tự thêm "/rerank"); model embeddings giữ nguyên như cũ.
#  - KHÔNG cần API key: Infinity mặc định không kiểm tra auth (client gửi gì cũng được,
#    LiteLLM để api_key "none"). Muốn bật auth: thêm flag `--api-key <key>`
#    → client phải gửi header `Authorization: Bearer <key>`.
#  - `--engine torch`: BẮT BUỘC (engine optimum lỗi thiếu file ONNX với 2 model này).
#  - `--no-model-warmup`: bỏ warmup (CPU yếu nên warmup rất lâu) → boot nhanh.
#  - Thêm model mới: thêm 1 dòng `--model-id <repo>` (1 instance chạy nhiều model;
#    option riêng của từng model thì truyền lặp theo đúng thứ tự).
#  - Cache model dùng chung /home/Docker/tei-data (layout HF cache) — đã có sẵn cả 2 model.
#  - Bản này đã CHẠY THỬ NGHIỆM NGUYÊN XI trên máy llm (2026-09-15): boot ~20-40s,
#    /v1/embeddings dims=1024 OK, /v1/rerank OK, RAM ~3.0GB cho cả 2 model.
# ================================================================

name: tei

services:
  infinity:
    image: michaelf34/infinity:latest-cpu
    container_name: infinity
    restart: unless-stopped
    ports:
      - "10.21.4.101:8080:8080"
    volumes:
      - /home/Docker/tei-data:/data
    environment:
      HF_HOME: /data
      HF_HUB_CACHE: /data
      HUGGINGFACE_HUB_CACHE: /data
      DO_NOT_TRACK: "1"
    command:
      - v2
      - --engine
      - torch                        # bắt buộc — optimum lỗi ONNX với 2 model này
      - --model-id
      - BAAI/bge-m3                  # embeddings — 1024 chiều, tối đa ~8192 token
      - --model-id
      - BAAI/bge-reranker-v2-m3      # rerank — trả relevance score (không có "dim")
      - --port
      - "8080"
      - --url-prefix
      - "/v1"                        # giữ đường dẫn /v1/... cho các client cũ
      - --no-model-warmup            # warmup CPU yếu bị treo — tắt để boot nhanh
    cpus: "3"
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 128
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
