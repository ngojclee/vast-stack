# ================================================================
# TEI + Infinity stack — embeddings & rerank cho máy llm (10.21.4.101)
#
# Deploy qua Portainer (server llm) → Stacks → Add stack:
#   Repository: https://github.com/ngojclee/vast-stack.git
#   Compose path: tei/compose.yml
# (không cần env nào — mọi cấu hình nằm trong file này)
#
# TRƯỚC KHI DEPLOY — xoá 2 container cũ đang chạy tay (chiếm tên + cổng 8080/8081):
#   docker rm -f tei-bge-m3 tei-bge-reranker
# (embeddings sẽ nạp lại từ cache /home/Docker/tei-data trong ~1 phút)
#
# Sau khi deploy:
#   - Embeddings : http://10.21.4.101:8080   (BAAI/bge-m3, TEI)
#   - Rerank     : http://10.21.4.101:8081   (BAAI/bge-reranker-v2-m3, Infinity,
#                  API chuẩn Cohere /rerank → đi thẳng vào LiteLLM branch "infinity/")
#   Test nhanh:
#     curl -s http://10.21.4.101:8081/health
#     curl -s http://10.21.4.101:8081/rerank -H 'Content-Type: application/json' \
#       -d '{"model":"BAAI/bge-reranker-v2-m3","query":"con mèo đang ngủ ở đâu",
#            "documents":["con mèo đang ngủ trên ghế sofa","trời hôm nay mưa rất to"]}'
#
# GHI CHÚ QUAN TRỌNG:
#  - TEI reranker cũ (API riêng {query,texts}) ĐÃ BỊ THAY hoàn toàn: LiteLLM
#    không có route nào gửi đúng format đó; Infinity nói chuẩn Cohere nên
#    LiteLLM route trực tiếp được. Nếu có client cũ gọi thẳng kiểu {query,texts}
#    thì phải chuyển sang gọi qua LiteLLM :4000.
#  - Model cache dùng chung /home/Docker/tei-data (cả 2 service, cùng layout HF cache).
#  - Cấu hình Infinity dưới đây là bản ĐÃ CHẠY THỬ NGHIỆM NGUYÊN XI trên máy llm
#    (boot ~15s, rerank OK, RAM ~1.2-1.6GB) — đừng đổi lung tung.
# ================================================================

name: tei

services:
  # ============ EMBEDDINGS — TEI, giữ nguyên cấu hình đã tinh chỉnh ============
  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: tei-bge-m3
    restart: unless-stopped
    ports:
      - "10.21.4.101:8080:80"
    volumes:
      - /home/Docker/tei-data:/data
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      RAYON_NUM_THREADS: "3"
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--max-concurrent-requests"
      - "4"
      - "--max-batch-tokens"
      - "2048"
      - "--max-client-batch-size"
      - "16"
      - "--payload-limit"
      - "1000000"
    cpus: "3"
    mem_limit: 10g
    memswap_limit: 10g
    pids_limit: 128
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ============ RERANK — Infinity (bge-reranker-v2-m3, API chuẩn Cohere) ============
  infinity-rerank:
    image: michaelf34/infinity:latest-cpu
    container_name: infinity-rerank
    restart: unless-stopped
    ports:
      - "10.21.4.101:8081:8080"
    volumes:
      - /home/Docker/tei-data:/data
    environment:
      # Cache model chung với TEI (cùng layout HF cache) → không tải lại
      HF_HOME: /data
      HF_HUB_CACHE: /data
      HUGGINGFACE_HUB_CACHE: /data
      DO_NOT_TRACK: "1"
    command:
      - v2
      - --engine
      - torch                 # engine "optimum" (mặc định) lỗi: model này không có file ONNX
      - --model-id
      - BAAI/bge-reranker-v2-m3
      - --port
      - "8080"
      - --no-model-warmup     # warmup trên CPU yếu bị treo/OOM; tắt để boot nhanh (~15s)
    cpus: "2"
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 128
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
